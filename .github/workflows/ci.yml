name: CI

# Stage 1 (spec 13.6): one job, no sibling checkout and no tarballs. Node 22.13.0 is the lower
# bound of `engines` (node:sqlite without a flag, process.getBuiltinModule); 22.x and 24.x are the
# current lines. The suite includes the PTY tests (script(1) from util-linux) and the SQLite
# reader tests on the built-in node:sqlite. Before Node 22.15 node:sqlite takes no URI filenames,
# so on 22.13.0 a WAL store in a read-only directory is the named read-error, not an immutable open.

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["22.13.0", "22.x", "24.x"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Lint (tsc + prettier)
        run: npm run lint

      - name: Test (builds first)
        run: npm test
